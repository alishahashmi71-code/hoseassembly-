  <!-- ========================================
       GLOBAL STYLES & ANIMATIONS
       Scoped to avoid conflicts with HubSpot
       ======================================== -->
  <style>
    /* ========================================
       CSS RESET FOR LANDING PAGE MODULES ONLY
       ======================================== */
    .applied-landing-page * {
      box-sizing: border-box;
    }
    /* ========================================
       BRAND COLORS - Applied Industrial
       ======================================== */
    :root {
      --applied-teal: #007b85;
      --applied-teal-dark: #005662;
      --applied-navy: #1E2F5C;
      --applied-navy-dark: #12203F;
      --applied-white: #ffffff;
      --applied-gray-light: #F5F5F5;
      --applied-gray: #616161;
      --applied-black: #000000;
    }
    /* ========================================
       TYPOGRAPHY UTILITIES
       ======================================== */
    .applied-landing-page {
      font-family: "din-2014", "DIN 2014", "DIN Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #000000;
    }
    /* ========================================
       GLOBAL ANIMATIONS
       ======================================== */
    @keyframes appliedFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes appliedSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes appliedSlideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes appliedSlideLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes appliedSlideRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes appliedScaleUp {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    /* Gallery infinite scroll — used in module-03b */
    @keyframes ait-gallery-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ait-gallery-track { animation: ait-gallery-scroll 40s linear infinite; }
    .ait-gallery-track:hover { animation-play-state: paused; }
    /* CTA button hover — used in module-03b (dark final CTA: shadow deepens, fill/text stay put) */
    .ait-cta-btn:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.3) !important; transform: translateY(-1px) !important; }
    /* ========================================
       HERO MODULE ANIMATIONS
       ======================================== */
    @keyframes appliedHeroFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes appliedHeroSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* ========================================
       VIDEO BACKGROUND STYLES
       ======================================== */
    .applied-hero-video-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    @media (max-width: 768px) {
      .applied-hero-video-bg { display: none; }
    }
    /* ========================================
       UTILITY CLASSES
       ======================================== */
    .applied-section-padding { padding: 80px 20px; }
    .applied-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .applied-text-center { text-align: center; }
    /* ========================================
       RESPONSIVE BREAKPOINTS
       ======================================== */
    @media (max-width: 768px) { .applied-section-padding { padding: 60px 20px; } }
    @media (max-width: 480px) { .applied-section-padding { padding: 40px 20px; } }
    /* ========================================
       MODULE: SOLUTION TILES
       ======================================== */
    .applied-tiles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .applied-tile {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .applied-tile:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.12);
    }
    .applied-tile-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .applied-tile-body {
      padding: 24px 22px 22px 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .applied-tile-accent {
      display: inline-block;
      width: 44px;
      height: 4px;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .applied-tile h3 {
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      margin: 0 0 10px 0;
      line-height: 1.25;
    }
    .applied-tile p {
      font-size: 14px;
      color: #616161;
      line-height: 1.6;
      margin: 0 0 16px 0;
    }
    .applied-tile ul {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
      flex-grow: 1;
    }
    .applied-tile ul li {
      font-size: 13px;
      color: #424242;
      line-height: 1.5;
      padding: 5px 0 5px 18px;
      position: relative;
    }
    .applied-tile ul li::before {
      content: "•";
      position: absolute;
      left: 4px;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.3;
    }
    .applied-tile-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      border: 2px solid transparent;
      align-self: flex-start;
      transition: all 0.25s ease;
    }
    .applied-tile-cta:hover { transform: translateY(-1px); }
    /* Tile color variants — brand teal + navy only */
    .applied-tile.tile-teal   { border-top: 5px solid #007b85; }
    .applied-tile.tile-teal .applied-tile-accent { background: #007b85; }
    .applied-tile.tile-teal ul li::before { color: #007b85; }
    .applied-tile.tile-teal .applied-tile-cta { background: #007b85; color: #ffffff; border-color: #007b85; }
    .applied-tile.tile-teal .applied-tile-cta:hover { background: #005662; border-color: #005662; box-shadow: 0 6px 18px rgba(0,123,133,0.40); }
    .applied-tile.tile-navy { border-top: 5px solid #1E2F5C; }
    .applied-tile.tile-navy .applied-tile-accent { background: #1E2F5C; }
    .applied-tile.tile-navy ul li::before { color: #1E2F5C; }
    .applied-tile.tile-navy .applied-tile-cta { background: #007b85; color: #ffffff; border-color: #007b85; }
    .applied-tile.tile-navy .applied-tile-cta:hover { background: #005662; border-color: #005662; box-shadow: 0 6px 18px rgba(0,123,133,0.40); }
    @media (max-width: 1024px) {
      .applied-tiles-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .applied-tiles-grid { grid-template-columns: 1fr; }
    }
    /* ========================================
       MODULE: INDUSTRIES STRIP
       ======================================== */
    .applied-industries-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-top: 36px;
    }
    .applied-industry-chip {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 22px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #000000;
      line-height: 1.3;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
    }
    .applied-industry-chip:hover {
      border-color: #007b85;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    @media (max-width: 968px) {
      .applied-industries-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .applied-industries-grid { grid-template-columns: 1fr; }
    }
    /* ========================================
       MODULE: CAPABILITIES AT A GLANCE
       ======================================== */
    .applied-capabilities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .applied-capability-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-left: 4px solid #007b85;
      border-radius: 10px;
      padding: 24px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .applied-capability-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .applied-capability-value {
      font-size: 26px;
      font-weight: 700;
      color: #000000;
      line-height: 1.2;
      margin: 0 0 6px 0;
    }
    .applied-capability-label {
      font-size: 14px;
      color: #616161;
      line-height: 1.5;
      margin: 0;
    }
    @media (max-width: 768px) {
      .applied-capabilities-grid { grid-template-columns: 1fr; }
    }
    /* ========================================
       MODULE 2: Program Overview
       ======================================== */
    @media (max-width: 968px) {
      .applied-overview-grid { grid-template-columns: 1fr !important; gap: 30px !important; }
    }
    @media (max-width: 480px) {
      .applied-program-overview { padding: 50px 20px !important; }
      .applied-program-overview h2 { font-size: 26px !important; line-height: 1.3 !important; }
      .applied-program-overview h3 { font-size: 20px !important; line-height: 1.3 !important; }
      .applied-program-overview p { font-size: 15px !important; line-height: 1.6 !important; }
      .applied-overview-grid img {
        max-width: 100% !important; width: 100% !important; height: auto !important;
        min-height: 250px !important; object-fit: cover !important; border-radius: 8px !important;
      }
    }
    /* ========================================
       MODULE 3: Benefits With Image
       ======================================== */
    @media (max-width: 968px) {
      .applied-benefits-two-col { grid-template-columns: 1fr !important; gap: 30px !important; }
      .applied-benefits-two-col > div:last-child { order: -1 !important; }
    }
    @media (max-width: 480px) {
      .applied-benefits-with-image { padding: 50px 20px !important; }
      .applied-benefits-with-image h2 { font-size: 26px !important; line-height: 1.3 !important; }
      .applied-benefits-with-image h3 { font-size: 18px !important; line-height: 1.3 !important; }
      .applied-benefits-with-image p { font-size: 14px !important; line-height: 1.6 !important; }
      .applied-benefits-two-col img {
        max-width: 100% !important; width: 100% !important; height: auto !important;
        min-height: 250px !important; object-fit: cover !important; border-radius: 12px !important;
      }
    }
  </style>
</head>
<!-- ========================================
     INTERACTIVE MAP STYLES

<style>

     VIDEO CAROUSEL STYLES
     ======================================== -->
